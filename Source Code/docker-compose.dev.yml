# Dev overlay: run zig-platform in auto-rebuild watch mode with source mounted.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  zig-platform:
    build:
      context: backend/zig
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    command: ["sh", "/app/watch.sh"]
    volumes:
      - ./backend/zig:/app
      - zig-cache:/root/.cache/zig
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  zig-cache:

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rust-backend:
    build:
      context: backend/rust
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017

  java-backend:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - spring.data.mongodb.uri=mongodb://mongodb:27017/elite-shop

  go-backend:
    build:
      context: backend/go
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - rust-backend
      - java-backend
      - go-backend

volumes:
  mongodb_data:

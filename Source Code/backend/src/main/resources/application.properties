server.port=3001
spring.jackson.default-property-inclusion=non_null
spring.data.mongodb.uri=mongodb://localhost:27017/eliteshop?connectTimeoutMS=2000&serverSelectionTimeoutMS=2000
spring.data.mongodb.database=eliteshop

# Project Loom: run Jetty on virtual threads instead of a fixed platform-thread pool
# (memory per connection ~2KB vs ~1MB, no pool exhaustion under concurrency)
spring.threads.virtual.enabled=true

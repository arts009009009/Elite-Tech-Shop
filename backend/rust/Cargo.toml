[package]
name = "products-service"
version = "1.8.0"
edition = "2021"
description = "Elite Shop Products Catalog Service"
license = "MIT"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "macros", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

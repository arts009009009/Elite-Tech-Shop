name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─── Frontend ─────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Source Code/frontend"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      # `next lint` no longer exists in Next 16, so run eslint directly.
      # Non-blocking for now: the frontend pins typescript@7 and
      # typescript-eslint does not support TS 7 yet (it throws on load).
      - name: Lint
        run: npx eslint
        continue-on-error: true
      - name: Build
        run: npx next build

  # ─── Rust backend ────────────────────────────────────────────
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        working-directory: "Source Code/backend/rust"
        run: cargo check

  # ─── Go backend ──────────────────────────────────────────────
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: "Source Code/backend/go/go.sum"
      - name: Build and test
        working-directory: "Source Code/backend/go"
        run: |
          go build ./...
          go test ./...

  # ─── Java backend ────────────────────────────────────────────
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        working-directory: "Source Code/backend"
        run: mvn -B -DskipTests package

  # ─── End-to-end (Playwright) ─────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Source Code"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install root dependencies
        run: npm install
      - name: Install frontend dependencies
        working-directory: "Source Code/frontend"
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # playwright.config.ts starts `next dev` itself (webServer).
      - name: Run Playwright tests
        run: npx playwright test
